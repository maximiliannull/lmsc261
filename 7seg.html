function writeLetter(segmentTrue, letterX, letterY, letterWidth){
let letterHeight = letterWidth
ctx.lineCap = "round"
ctx.lineWidth = 4;

    ctx.beginPath();
    ctx.moveTo(letterX+segmentOffset, letterY);
    ctx.lineTo(letterX+segmentOffset, letterY);
